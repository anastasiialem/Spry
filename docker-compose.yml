# Local development stack. `docker compose up --build` is the only command to run.
name: spry

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spry}
      POSTGRES_DB: ${POSTGRES_DB:-spry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # dev only: lets you inspect the DB from the host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # wait until Postgres answers, not just starts
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spry}:${POSTGRES_PASSWORD:-spry}@db:5432/${POSTGRES_DB:-spry}
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app # dev only: live code + uvicorn --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Read by the browser, so it is the host's address, not http://backend:8000.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      # Written to .env by make deploy-auth; empty means "no sign-in".
      VITE_COGNITO_AUTHORITY: ${COGNITO_AUTHORITY:-}
      VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      VITE_COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app # dev only: live code + Vite HMR
      - /app/node_modules # keep the image's node_modules, not the host's

volumes:
  pgdata:
