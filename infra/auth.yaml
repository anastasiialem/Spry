AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Spry sign-in: a Cognito user pool with Cognito's managed login (email +
  password, self sign-up on) federated to Google. The frontend is a public
  client (no secret) using the authorization-code flow with PKCE. Deployed by
  scripts/deploy-auth.sh (make deploy-auth).

  Cost: the Essentials tier is free up to 10,000 monthly active users.

Parameters:
  ProjectName:
    Type: String
    Default: spry

  DomainPrefix:
    Type: String
    Description: >-
      https://<prefix>.auth.<region>.amazoncognito.com. Lowercase letters,
      digits and hyphens; may not contain aws, amazon or cognito.
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"

  GoogleClientId:
    Type: String
    Description: OAuth client ID of a "Web application" client in Google Cloud.

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: >-
      Its secret. Only Cognito ever holds it - never the repository, never the
      frontend bundle.

  CallbackUrls:
    Type: CommaDelimitedList
    Description: >-
      Where Cognito may send the browser back with a code. Must match the
      frontend's redirect_uri exactly, trailing slash included.

  LogoutUrls:
    Type: CommaDelimitedList
    Description: Where Cognito may send the browser after signing out.

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      # People sign in with their email; there is no separate username.
      UsernameAttributes: [email]
      # Cognito emails a confirmation code on sign-up.
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      # Self sign-up stays on, so anyone (the lecturer too) can create an account.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Required attributes are asked on the managed sign-up form. They can only
      # be set when the pool is created - adding one later replaces the pool.
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: preferred_username
          AttributeDataType: String
          Required: true
          Mutable: true
      # Managed login (version 2) needs Essentials; the first 10,000 MAU are free.
      UserPoolTier: ESSENTIALS
      DeletionProtection: INACTIVE
      # One person, one account: see LinkAccountsFunction.
      LambdaConfig:
        PreSignUp: !GetAtt LinkAccountsFunction.Arn
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  # Pre sign-up trigger. Without it "Sign in with Google" and email + password
  # with the same address are two users with two different `sub`s - and two
  # different calendars.
  #   - Google sign-in, first time, and a password account with that email
  #     exists and is verified -> link Google to it: Google now signs in as
  #     that user (same sub, same meetings).
  #   - Password sign-up for an email that already signs in with Google ->
  #     refused with a hint, instead of creating a second account.
  # Linking needs the email verified on both sides (Google says so, and the
  # password user typed the code from the email); otherwise nothing is linked.
  LinkAccountsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-link-accounts"
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt LinkAccountsRole.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      Code:
        ZipFile: |
          import boto3

          cognito = boto3.client("cognito-idp")
          PROVIDERS = {"google": "Google"}


          def users_with_email(pool, email):
              if not email or '"' in email:
                  return []
              resp = cognito.list_users(UserPoolId=pool, Filter=f'email = "{email}"')
              return resp["Users"]


          def attrs(user):
              return {a["Name"]: a["Value"] for a in user.get("Attributes", [])}


          def handler(event, context):
              pool = event["userPoolId"]
              source = event["triggerSource"]
              new = event["request"]["userAttributes"]
              email = (new.get("email") or "").strip().lower()

              if source == "PreSignUp_ExternalProvider":
                  if str(new.get("email_verified")).lower() != "true":
                      return event
                  # userName looks like "google_1234567890": the pool is case
                  # insensitive, so it arrives lowercased, while the link call
                  # wants the provider's real name ("Google").
                  prefix, _, provider_id = event["userName"].partition("_")
                  provider = PROVIDERS.get(prefix.lower())
                  if not provider or not provider_id:
                      return event
                  for user in users_with_email(pool, email):
                      if user.get("UserStatus") == "EXTERNAL_PROVIDER":
                          continue
                      if attrs(user).get("email_verified") != "true":
                          continue
                      cognito.admin_link_provider_for_user(
                          UserPoolId=pool,
                          DestinationUser={
                              "ProviderName": "Cognito",
                              "ProviderAttributeValue": user["Username"],
                          },
                          SourceUser={
                              "ProviderName": provider,
                              "ProviderAttributeName": "Cognito_Subject",
                              "ProviderAttributeValue": provider_id,
                          },
                      )
                      print(f"linked {provider} to existing user {user['Username']}")
                      break

              elif source == "PreSignUp_SignUp":
                  for user in users_with_email(pool, email):
                      if user.get("UserStatus") == "EXTERNAL_PROVIDER":
                          raise Exception(
                              "This email already signs in with Google - use Sign in with Google"
                          )

              return event

  LinkAccountsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: link-accounts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Pool ARN by pattern: naming the pool itself would be a cycle
              # (the pool needs this function first).
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminLinkProviderForUser
                Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LinkAccountsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LinkAccountsFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      # Without this a Google user lands in the pool with no email, and the
      # header has nothing to show.
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name
        # Required in this pool, so a Google user needs one too: their Google name.
        preferred_username: name
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # A client that names a provider which does not exist yet fails to create.
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: !Sub "${ProjectName}-web"
      UserPoolId: !Ref UserPool
      # Public client: a browser cannot keep a secret, so it gets none. PKCE
      # protects the code exchange instead.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO, Google]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # "No such user" and "wrong password" look the same to a stranger.
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 2

  # Without a branding style a version-2 domain has no sign-in page to show.
  # Starts from Cognito's defaults; deploy-auth.sh then adds the page background
  # image through the API (merging into these settings).
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool

  ManagedLoginBrandingId:
    Value: !GetAtt ManagedLoginBranding.ManagedLoginBrandingId

  ClientId:
    Value: !Ref UserPoolClient

  # What oidc-client-ts calls the authority: discovery lives under it.
  Authority:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  # The managed login / logout host.
  Domain:
    Value: !Sub "https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  GoogleRedirectUri:
    Description: Paste into the Google OAuth client as the authorised redirect URI.
    Value: !Sub "https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
