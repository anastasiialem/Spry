AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Spry backend on AWS Lambda: the FastAPI app in a container image, served over
  HTTPS by a Lambda function URL, with PostgreSQL 17 on a single RDS
  db.t4g.micro instance (free-tier eligible) in private subnets. Deployed by scripts/deploy-backend.sh, which
  builds and pushes the image first - the ECR repository lives outside this
  stack because the function cannot be created until an image exists.

  Why RDS and not Aurora: see docs/decisions/0003-rds-instead-of-aurora.md.

  A function URL cannot carry a custom domain, so when ApiDomainName and
  ApiCertificateArn are set a CloudFront distribution (no caching) sits in front
  of it and answers on api.<domain> with the ACM certificate.

Parameters:
  ProjectName:
    Type: String
    Default: spry
    Description: Prefix for every resource name, and the project tag.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that holds the function's network interfaces and the database.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Two or more subnets, in different AZs, for the function and the database.
      The function needs no internet access - it only talks to the database -
      so the default VPC's subnets do without a NAT gateway.

  ImageUri:
    Type: String
    Description: Fully qualified image, e.g. <account>.dkr.ecr.<region>.amazonaws.com/spry-backend:abc1234

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: arm64 (Graviton) is cheaper per GB-second and builds natively on Apple Silicon.

  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: MB. CPU is allocated in proportion, so this also sets the speed.

  TimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 900
    Description: Seconds. Generous enough for a cold start plus a database connect.

  DbName:
    Type: String
    Default: spry

  DbUsername:
    Type: String
    Default: spry

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >-
      Generated and remembered by the deploy script. RDS forbids /, ", @ and
      spaces here, which also keeps the composed connection URL safe to use raw.

  DbEngineVersion:
    Type: String
    Default: "17"
    Description: RDS PostgreSQL major version - matches postgres:17-alpine in Compose.

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: Smallest Graviton class, ~$0.016/h (free tier only on pre-2025-07-15 accounts).

  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 20
    Description: GB of gp2 - the minimum RDS allows.

  DbBackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 35

  AppEnv:
    Type: String
    Default: production
    AllowedValues: [development, test, production]

  LogLevel:
    Type: String
    Default: info

  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated browser origins; set this to the deployed frontend URL.

  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: >-
      From the spry-auth stack. Empty: every /api route answers 503 in
      production - never an open door.

  CognitoClientId:
    Type: String
    Default: ""
    Description: Access tokens issued to any other app client are refused.

  CognitoJwks:
    Type: String
    Default: ""
    Description: >-
      The pool's public signing keys (JSON). The function has no route to the
      internet to fetch them, so the deploy script downloads and passes them.

  ApiDomainName:
    Type: String
    Default: ""
    Description: Optional custom domain for the API, e.g. api.example.com (step 6).

  ApiCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate for ApiDomainName. Must be in us-east-1 (CloudFront).

  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 zone holding ApiDomainName. Set, the stack owns the alias
      records; empty, you create the CNAME wherever your DNS lives.

  LogRetentionDays:
    Type: Number
    Default: 7
    Description: CloudWatch gives 5 GB of ingestion and storage free each month.

Conditions:
  HasApiDomain: !And
    - !Not [!Equals [!Ref ApiDomainName, ""]]
    - !Not [!Equals [!Ref ApiCertificateArn, ""]]
  HasApiDnsZone: !And
    - !Condition HasApiDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  # --- networking ---------------------------------------------------------

  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} backend function"
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-backend-function"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} database"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Postgres, from the function only
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- database -----------------------------------------------------------

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} database"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # A starter database: one small instance, never reachable from the
  # internet, and torn down with the stack. Turn on DeletionProtection before
  # this holds anything you would miss.
  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp2
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: false
      DeleteAutomatedBackups: true
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Kept for people and tools: the deploy script reads the password back from
  # here, so it stays stable across deploys. The function does not read it - it
  # has no route to Secrets Manager without a NAT gateway or a paid endpoint -
  # and gets the same string as an environment variable instead.
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/backend/database-url"
      Description: !Sub "SQLAlchemy async connection string for ${ProjectName}"
      SecretString: !Sub
        - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
        - Endpoint: !GetAtt DbInstance.Endpoint.Address
          Port: !GetAtt DbInstance.Endpoint.Port
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- function -----------------------------------------------------------

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Logs, plus the network interfaces a function in a VPC needs.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-backend"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Function:
    Type: AWS::Lambda::Function
    DependsOn: DbInstance
    Properties:
      FunctionName: !Sub "${ProjectName}-backend"
      Description: !Sub "${ProjectName} FastAPI backend"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [!Ref Architecture]
      MemorySize: !Ref MemorySize
      Timeout: !Ref TimeoutSeconds
      Role: !GetAtt ExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref FunctionSecurityGroup]
      Environment:
        Variables:
          APP_ENV: !Ref AppEnv
          LOG_LEVEL: !Ref LogLevel
          CORS_ORIGINS: !Ref CorsOrigins
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks
          # No pool: many warm Lambda environments each holding a connection
          # would exhaust a micro instance's connection limit.
          DB_POOLING: "false"
          DATABASE_URL: !Sub
            - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
            - Endpoint: !GetAtt DbInstance.Endpoint.Address
              Port: !GetAtt DbInstance.Endpoint.Port
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # HTTPS out of the box, on AWS's certificate. CORS is left to the app, since
  # configuring it here too would send every header twice.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      AuthType: NONE

  # A public function URL needs both grants: InvokeFunctionUrl, and
  # InvokeFunction limited to calls that came through the URL.
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # --- custom domain (optional, step 6) -----------------------------------

  # CloudFront in front of the function URL: it terminates HTTPS for
  # api.<domain> with our ACM certificate and forwards everything, uncached.
  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasApiDomain
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} api"
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: [!Ref ApiDomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref ApiCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: lambda
            DomainName: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: lambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingDisabled: an API answer is never served from cache.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewerExceptHostHeader: query, headers (Origin for CORS,
          # Content-Type for uploads) pass through; Host must stay the URL's own.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasApiDnsZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ApiDnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: HasApiDnsZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt ApiDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  ApiUrl:
    Description: Base URL of the backend, with no trailing slash.
    Value: !Sub
      - "https://${Host}"
      - Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]

  PublicApiUrl:
    Description: What the frontend should call - the custom domain when set.
    Value: !If
      - HasApiDomain
      - !Sub "https://${ApiDomainName}"
      - !Sub
        - "https://${Host}"
        - Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]

  ApiDistributionDomainName:
    Description: Point api.<domain> here (CNAME) when DNS is not in Route 53.
    Value: !If [HasApiDomain, !GetAtt ApiDistribution.DomainName, "none"]

  FunctionName:
    Value: !Ref Function

  DatabaseEndpoint:
    Value: !GetAtt DbInstance.Endpoint.Address

  DatabaseUrlSecretArn:
    Value: !Ref DatabaseUrlSecret

  LogGroupName:
    Value: !Ref LogGroup
